name: red-news-alert
# Cảnh báo tin đỏ Mỹ trước giờ ra tin + KẾT QUẢ sau giờ ra tin (actual vs forecast) (Telegram @HTFXGROUP + OneSignal nếu có). Xem scripts/red-news-alert.py
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chỉ log, không gửi (1/0)'
        default: '1'
      now_utc:
        description: 'Giả lập thời điểm (ISO UTC, để test), vd 2026-10-14T12:15:00Z'
        default: ''
permissions:
  contents: write
  pages: write
concurrency:
  group: red-news-alert
  cancel-in-progress: false
jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 50   # job tự lặp mỗi 60s từ T-12 tới khi có actual (tối đa T+30)
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "data/calendar-us.json\nscripts/red-news-alert.py", sparse-checkout-cone-mode: false }
      - name: Khôi phục trạng thái đã gửi
        uses: actions/cache/restore@v4
        with:
          path: .alert-state.json
          key: red-alert-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: red-alert-state-
      - name: Gửi cảnh báo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '-1001396622973'
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID || secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
          ALERT_STATE: .alert-state.json
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
          NOW_UTC: ${{ inputs.now_utc }}
        run: python3 scripts/red-news-alert.py
      - name: Ghi actual lên lịch website
        if: always()
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git diff --quiet -- data/calendar-us.json && { echo "Lịch không đổi"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar-us.json && git commit -m "Lịch tin Mỹ: cập nhật số thực tế (red-news-alert, tự động)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push origin HEAD:main && { gh api -X POST "repos/${{ github.repository }}/pages/builds" || true; exit 0; }; sleep 5; done
          echo "push lịch thất bại (tin Telegram vẫn đã gửi)"
      - name: Lưu trạng thái
        if: always() && hashFiles('.alert-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .alert-state.json
          key: red-alert-state-${{ github.run_id }}-${{ github.run_attempt }}
