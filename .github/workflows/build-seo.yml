name: build-seo
# Tự sinh bai/*.html, sitemap.xml, robots.txt từ data/*.json (scripts/build-seo.py).
# Chống lặp: push bằng GITHUB_TOKEN không kích hoạt workflow khác + bỏ qua khi actor là bot.
# Bài đăng từ /admin/ (GitHub API, token của chủ site) sửa data/*.json → workflow này sinh trang và commit.
# Không dùng [skip ci] để GitHub Pages (pages-build-deployment) vẫn chạy; vẫn gọi API build Pages cho chắc.
on:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/build-seo.py']
  schedule:
    - cron: '5 0 * * *'   # 07:05 giờ VN – mở các mục hẹn ngày
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: build-seo
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 scripts/build-seo.py
      - name: Commit nếu có thay đổi
        id: c
        run: |
          git add -A bai en/posts sitemap.xml robots.txt index.html *.html
          if git diff --cached --quiet; then echo "Không có thay đổi"; echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build-seo: cập nhật trang tĩnh SEO (tự động)"
          git pull --rebase origin main && git push origin HEAD:main
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Kích hoạt build GitHub Pages
        if: steps.c.outputs.changed == '1'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed (Pages vẫn tự build khi có push)"
