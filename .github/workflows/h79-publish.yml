name: h79-publish
# Weekday boards and the Sunday news recap. Vietnam is UTC+7, no daylight saving.
# macro every day incl. Sat/Sun, up to three updates a VN day (sang / trua / toi):
#   morning 06:37 VN = 23:37 UTC the day before → 37 23 * * *
#   morning backup 05:52 VN = 22:52 UTC the day before → 52 22 * * *
#   noon 12:07 VN = 05:07 UTC → 7 5 * * *
#   evening 19:17 VN = 12:17 UTC → 17 12 * * *
#   GitHub delays runs, so the script picks the slot from the VN clock when it starts
#   (05–11 sang, 11–17 trua, 17–24 toi; 00–05 skips). A later update needs a
#   free slot, 3 hours since the last update that day, and stories not already on the board.
# domestic weekdays 08:43 VN = 01:43 UTC Mon–Fri → 43 1 * * 1-5
# domestic backup 08:13 VN = 01:13 UTC Mon–Fri → 13 1 * * 1-5
# weekly Sunday 09:00 VN = 02:00 UTC Sunday → 0 2 * * 0
# Domestic and weekly: whichever run lands first publishes that VN date; a later run exits without a commit.
# Macro: a run that finds nothing new, or a taken slot, exits without a commit.
# Secret: H79_RUN_TOKEN. Optional RENDER_DEPLOY_HOOK retriggers the same service once if health stays 502/503.
# Neither secret is printed. This workflow does not keep the free service awake between runs.
on:
  schedule:
    - cron: '52 22 * * *'
    - cron: '37 23 * * *'
    - cron: '7 5 * * *'
    - cron: '17 12 * * *'
    - cron: '13 1 * * 1-5'
    - cron: '43 1 * * 1-5'
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      task:
        description: macro, domestic, or weekly
        required: true
        type: choice
        options:
          - macro
          - domestic
          - weekly
permissions:
  contents: write
concurrency:
  group: h79-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ping generator
        run: curl -sS -o /dev/null --max-time 20 https://h79-ai-server.onrender.com/health || true
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish board
        env:
          H79_RUN_TOKEN: ${{ secrets.H79_RUN_TOKEN }}
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          H79_API_URL: https://h79-ai-server.onrender.com
          H79_TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.task || '' }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/h79_publish.py
